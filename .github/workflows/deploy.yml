
name: Build, Push and Deploy Docker Images

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:client-${{ github.ref_name }}

      - name: Build and Push Server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:server-${{ github.ref_name }}

  deploy-to-ec2:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_PUB_IP }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:client-main
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:server-main

            docker stop stylemart-client stylemart-server || true
            docker rm stylemart-client stylemart-server || true

            docker run -d \
              --name stylemart-client \
              --restart unless-stopped \
              -p 5173:5173 \
              ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:client-main

            docker run -d \
              --name stylemart-server \
              --restart unless-stopped \
              -p 5174:5173 \
              ${{ secrets.DOCKERHUB_USERNAME }}/1st_dockerrepo:server-main
